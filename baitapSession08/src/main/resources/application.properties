spring.application.name=baitapSession08
spring.config.import=optional:file:../.local-config/baitapSession08.properties,optional:file:./config/application-local.properties

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/library_management_session08}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jackson.deserialization.accept-float-as-int=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
